<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süt Tankı İzleme Sistemi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; text-align: center; padding: 10px; margin: 0; }
        .konteyner { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .kart-grubu { display: flex; justify-content: space-around; gap: 10px; }
        
        /* Tıklanabilir Sıcaklık Kartı Ayarı */
        .kart { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; flex: 1; transition: 0.3s; cursor: pointer; }
        .kart:active { transform: scale(0.95); background-color: #fcfcfc; }
        .etiket { font-size: 10px; color: #7f8c8d; text-transform: uppercase; }
        .deger { font-size: 18px; font-weight: bold; margin-top: 5px; }
        .sicaklik-renk { color: #e74c3c; }

        /* Grafik Penceresi (Modal) Tasarımı */
        #grafikPenceresi {
            display: none; /* Başlangıçta gizli */
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); 
        }
        .pencere-icerik {
            background-color: white; margin: 15% auto; padding: 20px;
            border-radius: 20px; width: 90%; max-width: 450px; position: relative;
        }
        .kapat-butonu { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>

<div class="konteyner">
    <h3 style="color: #2c3e50; font-size: 18px;">Süt Tankı Kontrol Paneli</h3>
    <p style="font-size: 12px; color: #bdc3c7;">Grafik için sıcaklığa tıkla</p>
    
    <div class="kart-grubu">
        <div class="kart" onclick="pencereyiAc()">
            <div class="etiket">Sıcaklık</div>
            <div class="deger sicaklik-renk">{{ data.sicaklik }}°C</div>
        </div>
        <div class="kart">
            <div class="etiket">Akım</div>
            <div class="deger" style="color:#f39c12">{{ data.akim }}A</div>
        </div>
        <div class="kart">
            <div class="etiket">Doluluk</div>
            <div class="deger" style="color:#3498db">{{ data.doluluk }}L</div>
        </div>
    </div>
</div>

<div id="grafikPenceresi">
    <div class="pencere-icerik">
        <span class="kapat-butonu" onclick="pencereyiKapat()">&times;</span>
        <h4 style="margin-top: 0;">24 Saatlik Sıcaklık Analizi</h4>
        <div style="height: 250px;">
            <canvas id="sicaklikGrafik"></canvas>
        </div>
    </div>
</div>

<script>
    // Sayfayı yenileme
    setInterval(function(){ 
        if(document.getElementById('grafikPenceresi').style.display !== 'block') {
            location.reload(); 
        }
    }, 5000);

    function pencereyiAc() { document.getElementById('grafikPenceresi').style.display = "block"; cizdir(); }
    function pencereyiKapat() { document.getElementById('grafikPenceresi').style.display = "none"; }

    function cizdir() {
        const ctx = document.getElementById('sicaklikGrafik').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['00:00', '06:00', '12:00', '18:00', 'Şimdi'],
                datasets: [{
                    label: 'Sıcaklık (°C)',
                    data: [4.2, 4.0, 5.5, 4.8, {{ data.sicaklik }}],
                    borderColor: '#e74c3c',
                    backgroundColor: 'rgba(231, 76, 60, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { min: 0, max: 30 } }
            }
        });
    }
</script>

</body>
</html>
