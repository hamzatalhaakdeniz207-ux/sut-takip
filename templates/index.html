<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Milk - Canlı Takip</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; text-align: center; padding: 10px; margin: 0; }
        .konteyner { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; }
        .kart-grubu { display: flex; justify-content: space-around; gap: 10px; margin-top: 20px; }
        .kart { background: #fff; border: 1px solid #f0f0f0; border-radius: 15px; padding: 15px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .etiket { font-size: 11px; color: #95a5a6; text-transform: uppercase; font-weight: bold; }
        .deger { font-size: 20px; font-weight: bold; margin-top: 8px; transition: all 0.3s ease; }
        .sicaklik-renk { color: #e74c3c; }
        .akim-renk { color: #f39c12; }
        .doluluk-renk { color: #3498db; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="konteyner">
    <h2>Smart Milk Analiz</h2>
    <p style="font-size: 12px; color: #bdc3c7;">Veriler anlık olarak güncellenmektedir</p>

    <div class="kart-grubu">
        <div class="kart">
            <div class="etiket">Sıcaklık</div>
            <div id="val-sicaklik" class="deger sicaklik-renk">--°C</div>
        </div>
        <div class="kart">
            <div class="etiket">Akım</div>
            <div id="val-akim" class="deger akim-renk">--A</div>
        </div>
        <div class="kart">
            <div class="etiket">Doluluk</div>
            <div id="val-doluluk" class="deger doluluk-renk">--L</div>
        </div>
    </div>
</div>

<script>
    // ARKA PLANDA VERİ ÇEKME SİSTEMİ (AJAX) [cite: 19, 21]
    function verileriGuncelle() {
        fetch('/veriler') // app.py'deki /veriler kapısına sorar [cite: 19]
            .then(res => res.json())
            .then(data => {
                // Sadece ilgili sayıları günceller [cite: 20]
                document.getElementById('val-sicaklik').innerText = data.sicaklik.toFixed(1) + "°C";
                document.getElementById('val-akim').innerText = data.akim.toFixed(2) + "A";
                document.getElementById('val-doluluk').innerText = data.doluluk.toFixed(1) + "L";
            })
            .catch(err => console.log("Veri çekme hatası:", err));
    }

    // Her 1 saniyede bir (1000 ms) verileri tazele [cite: 21]
    setInterval(verileriGuncelle, 1000);
    // Sayfa ilk açıldığında hemen bir kez çalıştır
    verileriGuncelle();
</script>

</body>
</html>
